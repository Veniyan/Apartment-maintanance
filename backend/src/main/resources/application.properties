spring.application.name=apartment
server.port=8081

# Load optional local env files and default to PostgreSQL.
# Prefer .env over the legacy en.env so stale local values do not override the active config.
spring.config.import=optional:file:../en.env[.properties],optional:file:en.env[.properties],optional:file:../.env[.properties],optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Change these in production!)
jwt.secret=mySecretKeyForJWT123456789012345678901234567890
jwt.expiration=86400000

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
