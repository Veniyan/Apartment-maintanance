spring.application.name=apartment
server.port=8081

# Database Configuration - H2 (In-Memory for Development)
spring.datasource.url=jdbc:h2:mem:apartmentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Change these in production!)
jwt.secret=mySecretKeyForJWT123456789012345678901234567890
jwt.expiration=86400000

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# H2 Console (Access at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# NOTE: For production, use PostgreSQL and environment variables
# See application-prod.properties.example for production configuration